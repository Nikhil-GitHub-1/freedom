
name: React Native Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Setup Java - same as local
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Setup Gradle caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 7. Verify environment
      - name: Verify build environment
        run: |
          node --version
          java -version
          cd android
          chmod +x gradlew
          ./gradlew --version

      # 8. Check Kotlin dependency availability
      - name: Verify Maven Central
        run: |
          curl --fail --location --retry 3 \
            --output /dev/null \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.0/kotlin-stdlib-2.3.0.pom

      # 9. Run lint
      - name: Run ESLint
        run: npm run lint --if-present

      # 10. Build Android APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

      # 11. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
